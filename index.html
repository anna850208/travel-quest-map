<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>互動式旅遊足跡與闖關地圖</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: sans-serif; }
    #header { padding: 12px 16px; background: #fff8eb; border-bottom: 1px solid #f0dfc2; display: flex; justify-content: space-between; align-items: center; }
    #map { height: calc(100vh - 54px); width: 100%; }
    .badge { font-weight: bold; color: #b45309; }
  </style>
</head>
<body>
  <div id="header">
    <span>🗺️ 城市探索闖關地圖</span>
    <span class="badge">已解鎖：<span id="score">0</span> / <span id="total">0</span> 關</span>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
